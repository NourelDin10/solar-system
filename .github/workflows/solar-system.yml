name: solar system overview
on:
    workflow_dispatch: 
    push: 
        branches: 
            - main 
            - 'feature/*'   

env:
  MONGO_URI: 'mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@cluster0.kirie.mongodb.net/?retryWrites=true&w=majority'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD}}

jobs:
  unit_test:  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm dependencies         
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies 
        run: npm install 

      - name: Run Unit Tests
        id: nodejs-unit-test-step
        run: npm test
        continue-on-error: true  # ✅ Allows pipeline to continue if tests fail

      - name: Archive test results 
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml   

  coverage_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  

      - name: Cache npm dependencies         
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }} 

      - name: Install dependencies 
        run: npm install

      - name: Check Code Coverage
        run: npm run coverage
        continue-on-error: true  # ✅ Allows pipeline to continue if coverage fails

      - name: Upload Code Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-results
          path: coverage
          retention-days: 5

  containerization:
    name: Containerization
    environment: TESTING
    needs: [unit_test, coverage_code]  # ✅ Depends on both jobs
    if: always()  # ✅ Runs even if tests or coverage fail
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }} 
       
      - name: Login to DHCR
        uses: docker/login-action@v3
        with:
            registry: ghcr.io  
            username: ${{ github.repository_owner}}
            password: ${{ secrets.GITHUB_TOKEN }}  
            
            

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/noureldin10/solar-system:${{github.sha}}  
             ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}} 


    
     
      # - name: build the image 
      #   run : |
      #     docker build -t ${{vars.DOCKERHUB_USERNAME}}/solar-system:latest .


      # - name: push the image to dockerhub
      #   run: |
      #     docker push  ${{vars.DOCKERHUB_USERNAME}}/solar-system:latest

