name: solar system overview
on:
    workflow_dispatch: 
    push: 
        branches: 
            - main 
            - 'feature/*'   
  

#env:
 # MONGO_URI: 'mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@cluster0.kirie.mongodb.net/?retryWrites=true&w=majority'
 
  #MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  #MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD}}
              

jobs:
    unit_test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v4
            
            - name: setup nodeJS version:10
              uses: actions/setup-node@v4
              with:
                    node-version: 18
           
            - name: install dependencies 
              run : npm install 
            - name: list files  
              run : ls -lR
            - name: upload node-module
              uses: actions/upload-artifact@v4
              with:
                    name: my-artifact
                    path: ./node_modules       