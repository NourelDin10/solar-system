name: test kubernates 
on: 
    push 
jobs:
    test_k8s:
        runs-on: ubuntu-latest
        steps:
            - name: connent to k8s
              uses: appleboy/ssh-action@v1
              with:
                host: ${{secrets.SSH_HOST}}
                username: ${{secrets.SSH_USER}}
                password: ${{ secrets.SSH_PRIVATE_KEY }}
                script: |
                     export KUBECONFIG=/home/nour/.kube/config
                     kubectl get nodes 


