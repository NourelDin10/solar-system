name: test kubernates 
on: 
    push 
jobs:
    test_k8s:
        runs-on: ubuntu-latest  
        steps:
            - name: install kubectl
              uses: azure/setup-kubectl@v4
              with:
               version: 'v1.30.0'
            - name: set kubeconfig
              uses: azure/k8s-set-context@v4
              with:
                method: kubeconfig
                kubeconfig: ${{secrets.KUBECONFIG}}
